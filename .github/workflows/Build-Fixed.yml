name: Build EXE - FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # תוקן: הורדתי את cache: 'pip' - זה מה שגרם לשגיאה
          # כי אין לך requirements.txt בריפו.
          # אם תעלה את requirements.txt, אפשר להחזיר את ה-cache.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build FULL EXE (CustomTkinter + RTL + Icon)
        run: pyinstaller --onefile --noconsole --icon=notepad-icon.ico --name "Notepad" notepad_full.py

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: Notepad-FULL-EXE
          path: dist/
          if-no-files-found: error
