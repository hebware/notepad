name: Build EXE - FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          if (Test-Path "Notepad-Full.py") {
            if (Test-Path "notepad-icon.ico") {
              pyinstaller --onefile --noconsole --icon=notepad-icon.ico --name "Notepad" Notepad-Full.py
            } else {
              pyinstaller --onefile --noconsole --name "Notepad" notepad-full.py
            }
          } elseif (Test-Path "Notepad-Full.py") {
            pyinstaller --onefile --noconsole --name "Notepad" Notepad-Full.py
          } else {
            Write-Host "ERROR: No .py file found!"
            Get-ChildItem
            exit 1
          }

      # --- תוקן: בלי actions/upload-artifact@v5 ---
      # זה מה שגרם לאזהרת Node.js 20.
      # במקום זה מעלים ל-Releases עם action שעובד על Node 24.
      - name: Upload EXE to Release (No Node 20 warning)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Notepad Build ${{ github.run_number }}
          files: dist/Notepad.exe
          generate_release_notes: true

