name: Build EXE - FULL DEBUG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # --- שלב אבחון: זה יראה לך בדיוק מה יש בריפו ---
      - name: DEBUG - Show files
        run: |
          echo "=== Current folder ==="
          dir
          echo "=== Check required files ==="
          if exist notepad_full.py (echo FOUND notepad_full.py) else (echo MISSING notepad_full.py - THIS IS THE ERROR!)
          if exist notepad-icon.ico (echo FOUND notepad-icon.ico) else (echo MISSING notepad-icon.ico - will build without icon)
          if exist notepad_ctk.py (echo FOUND notepad_ctk.py) else (echo no notepad_ctk.py)
          if exist requirements.txt (echo FOUND requirements.txt) else (echo no requirements.txt)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      # --- בילד חסין: אם אין אייקון, הוא בונה בלי אייקון ולא נופל ---
      - name: Build EXE (safe - works with or without icon)
        shell: pwsh
        run: |
          if (Test-Path "notepad_full.py") {
            if (Test-Path "notepad-icon.ico") {
              echo "Building WITH icon..."
              pyinstaller --onefile --noconsole --icon=notepad-icon.ico --name "Notepad" notepad_full.py
            } else {
              echo "Building WITHOUT icon (icon file missing, but build continues)..."
              pyinstaller --onefile --noconsole --name "Notepad" notepad_full.py
            }
          } elseif (Test-Path "notepad_ctk.py") {
            echo "notepad_full.py missing, falling back to notepad_ctk.py..."
            pyinstaller --onefile --noconsole --name "Notepad" notepad_ctk.py
          } else {
            echo "ERROR: No .py file found! Check file names in repo."
            dir
            exit 1
          }

      - name: Show dist folder
        run: dir dist

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: Notepad-FULL-EXE
          path: dist/
          if-no-files-found: error
