name: Build EXE - FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: DEBUG - Show files
        shell: pwsh
        run: |
          Write-Host "=== Current folder ==="
          Get-ChildItem
          Write-Host "=== Check required files ==="
          if (Test-Path "notepad-full.py") { Write-Host "FOUND notepad_full.py" } else { Write-Host "MISSING notepad_full.py" }
          if (Test-Path "notepad-icon.ico") { Write-Host "FOUND notepad-icon.ico" } else { Write-Host "MISSING notepad-icon.ico - will build without icon" }
          if (Test-Path "notepad_ctk.py") { Write-Host "FOUND notepad_ctk.py" } else { Write-Host "no notepad_ctk.py" }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          if (Test-Path "Notepad-Full.py") {
            if (Test-Path "notepad-icon.ico") {
              Write-Host "Building WITH icon..."
              pyinstaller --onefile --noconsole --icon=notepad-icon.ico --name "Notepad" notepad-Full.py
            } else {
              Write-Host "Building WITHOUT icon..."
              pyinstaller --onefile --noconsole --name "Notepad" notepad_full.py
            }
          } elseif (Test-Path "notepad_ctk.py") {
            Write-Host "notepad_full.py missing, falling back to notepad_ctk.py..."
            pyinstaller --onefile --noconsole --name "Notepad" notepad_ctk.py
          } else {
            Write-Host "ERROR: No .py file found!"
            Get-ChildItem
            exit 1
          }

      - name: Show dist folder
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: Notepad-FULL-EXE
          path: dist/
          if-no-files-found: error

